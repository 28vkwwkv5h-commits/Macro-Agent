[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-agent"
version = "0.1.0"
description = "Regime-driven trading agent: deterministic signal pipeline, backtest harness and guardrails (MVP, spec section 20.5)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
macro-agent = "macro_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
